<style>
:root{--bg:#09090b;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--tx:#f4f4f5;--mut:#9b9ba7;--a1:#f6c15a;--a2:#ff8a4c;--ok:#5ee6a8;--bad:#ff6b81;--r:20px;--fs:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
[data-theme=ink]{--bg:#070a14;--a1:#8b9bff;--a2:#c084fc}
[data-theme=forest]{--bg:#060d0a;--a1:#4ade80;--a2:#2dd4bf}
[data-theme=ember]{--bg:#0d0706;--a1:#ff7a45;--a2:#ff3d6e}
[data-theme=ocean]{--bg:#050b10;--a1:#38bdf8;--a2:#22d3ee}
[data-theme=violet]{--bg:#0a0612;--a1:#c084fc;--a2:#f472b6}
[data-theme=paper]{--bg:#f5f1e8;--card:rgba(255,255,255,.7);--card2:rgba(255,255,255,.95);--line:rgba(40,30,10,.1);--tx:#1d1b17;--mut:#6e685c;--a1:#c2761b;--a2:#d9480f;--ok:#12a066;--bad:#d6334f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);color-scheme:dark;scroll-behavior:smooth}
[data-light]{color-scheme:light}
body{font-family:'Outfit','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background .6s,color .4s;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:5000}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(100px);opacity:.15;background:var(--a1);left:-16vmax;top:-20vmax;animation:flo 26s ease-in-out infinite}
.orbs i+i{background:var(--a2);left:auto;top:auto;right:-14vmax;bottom:-18vmax;animation-delay:-11s}
[data-light] .orbs i{opacity:.2}
@keyframes flo{50%{transform:translate(7vmax,5vmax) scale(1.14)}}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
body.calm .orbs{display:none}
#app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.logo{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.logo svg,.logo img{width:38px;height:38px;border-radius:11px;flex:none;object-fit:cover}
.logo b{font-size:1.18rem;font-weight:700;letter-spacing:.2px}
.logo small{display:block;font-size:.68rem;color:var(--mut);font-weight:400;letter-spacing:1.6px;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:14px;color:var(--mut);font-weight:500;font-size:.95rem;position:relative;transition:.25s;text-align:left;width:100%}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{color:var(--tx);background:var(--card)}
.nv.on{color:var(--tx);background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 18%,transparent),transparent)}
.nv.on::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:linear-gradient(var(--a1),var(--a2));box-shadow:0 0 12px var(--a1)}
.nv.on svg{color:var(--a1)}
.sidefoot{margin-top:auto;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:.82rem;color:var(--mut)}
.sidefoot b{display:block;color:var(--tx);font-size:1.05rem;margin-bottom:2px}
main{min-width:0;padding:0 30px 130px}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + var(--sat)) 0 14px;margin-bottom:6px}
#top::before{content:"";position:absolute;inset:0 -30px;z-index:-1;background:linear-gradient(var(--bg) 40%,transparent);opacity:.85}
.tl{display:flex;align-items:center;gap:12px;min-width:0}
.tl h2{font-size:1.4rem;font-weight:700;white-space:nowrap}
.mlogo{display:none}
.pill{display:none;align-items:center;gap:8px;padding:7px 14px;border-radius:30px;background:color-mix(in srgb,var(--a1) 16%,transparent);border:1px solid color-mix(in srgb,var(--a1) 50%,transparent);font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill.show{display:inline-flex}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--a1);animation:pls 1.4s infinite}
@keyframes pls{50%{transform:scale(1.6);opacity:.4}}
#page{max-width:1120px;margin:0 auto}
.anim .rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:color-mix(in srgb,var(--a1) 30%,var(--line))}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,border-color .3s}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.eyebrow{font-size:.72rem;letter-spacing:1.8px;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{font-size:2.6rem;font-weight:700;line-height:1.05;letter-spacing:-.5px}
h1 small{font-size:1.2rem;color:var(--mut);font-weight:400;margin-left:6px}
h3{font-size:1.02rem;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:.84rem}.mono{font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;font-weight:600;font-size:.92rem;transition:.2s;position:relative;overflow:hidden;min-height:44px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(120deg,var(--a1),var(--a2));color:#14100a;box-shadow:0 10px 30px -10px var(--a1)}
.btn.p:hover{box-shadow:0 14px 38px -8px var(--a1);transform:translateY(-1px)}
[data-light] .btn.p{color:#fff}
.btn.g{background:var(--card2);border:1px solid var(--line)}.btn.g:hover{border-color:var(--a1)}
.btn.d{background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn.s{padding:7px 14px;min-height:36px;font-size:.82rem;border-radius:11px}
.btn.big{padding:15px 30px;font-size:1.02rem;border-radius:16px}

.tpk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tpk.c{grid-template-columns:1fr 1fr}
.tpk button{padding:11px 6px;border-radius:13px;border:1.5px solid color-mix(in srgb,var(--tc) 40%,var(--line));font-weight:700;font-size:.82rem;color:var(--tc);transition:.25s;min-height:44px}

.cpk{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--mut);font-weight:600}.cpk input{width:64px;height:40px;border:1px solid var(--line);border-radius:12px;background:none;padding:2px}
.task[data-i="0"]{--tk:#38bdf8}.task[data-i="1"]{--tk:#a78bfa}.task[data-i="2"]{--tk:#f472b6}.task[data-i="3"]{--tk:#fbbf24}
.task.on{border-color:color-mix(in srgb,var(--tk,var(--ok)) 65%,transparent);background:color-mix(in srgb,var(--tk,var(--ok)) 14%,transparent)}.task.on .bx{background:var(--tk,var(--ok));border-color:var(--tk,var(--ok))}
.task.pop{animation:tpop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes tpop{40%{transform:scale(1.07)}}
.star.on{animation:spS .6s}@keyframes spS{from{transform:rotate(-200deg) scale(.4)}}
.fl{position:fixed;z-index:5001;font-size:1.5rem;pointer-events:none;transform:translate(-50%,-50%);animation:flt 1.1s ease-out forwards;text-shadow:0 0 14px currentColor}
@keyframes flt{to{transform:translate(-50%,-200%) scale(1.5) rotate(12deg);opacity:0}}
.mission.cc,.li.cc{animation:ccg 1.8s ease-out}@keyframes ccg{0%{box-shadow:0 0 0 0 var(--ok)}30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 40%,transparent),0 0 50px var(--ok)}100%{box-shadow:0 0 0 0 transparent}}
.mission.cc::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28),transparent 70%);transform:translateX(-100%);animation:swp 1.2s .1s ease-out forwards;pointer-events:none}@keyframes swp{to{transform:translateX(100%)}}
.ccx{position:fixed;inset:0;z-index:4000;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:ccf 2.3s forwards}@keyframes ccf{0%,80%{opacity:1}100%{opacity:0}}
.ccr{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid var(--a1);animation:ccring 1.1s .15s ease-out forwards;opacity:0}.ccr.r2{border-color:var(--a2);animation-delay:.35s}
@keyframes ccring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(14)}}
.stamp{position:relative;text-align:center;padding:18px 30px;border-radius:22px;border:3px solid var(--a1);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--a1);transform:rotate(-8deg);animation:stm .7s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 60px -10px var(--a1)}
.stamp i{display:block;font-size:2.4rem;font-style:normal}.stamp b{display:block;font-size:1.2rem;letter-spacing:1.5px}.stamp span{display:block;color:var(--tx);font-size:.85rem;margin-top:4px;max-width:260px}
@keyframes stm{0%{transform:rotate(-30deg) scale(3);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.dcx{position:fixed;inset:0;z-index:420;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a1) 22%,rgba(0,0,0,.85)),rgba(0,0,0,.92));display:flex;align-items:center;justify-content:center;text-align:center;animation:fd .4s;transition:opacity .4s;overflow:hidden}.dcx.out{opacity:0}
.dcc{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px}.dcc h2{font-size:1.8rem;animation:wsIn .8s .9s both}.dcc p{color:var(--mut);animation:wsIn .8s 1.05s both;margin-bottom:10px}.dcc .btn{animation:wsIn .8s 1.2s both}
.dcp{stroke-dasharray:327;stroke-dashoffset:327;animation:dcd 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards}.dck{stroke-dasharray:90;stroke-dashoffset:90;animation:dcd .6s 1s ease forwards}@keyframes dcd{to{stroke-dashoffset:0}}
.dcr{position:absolute;width:140vmax;height:140vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--a1) 25%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000,transparent 40%);mask:radial-gradient(circle,#000,transparent 40%);animation:spin 40s linear infinite}
.btn.pulse{animation:plsB 1.6s infinite}@keyframes plsB{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a1) 70%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.badges{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.badges .bd{filter:none;cursor:pointer;opacity:.72;transition:transform .25s,box-shadow .3s}.badges .bd:active{transform:scale(.96)}
.badges .bd.on{opacity:1;background:linear-gradient(160deg,color-mix(in srgb,var(--g1) 18%,var(--card)),color-mix(in srgb,var(--g2) 8%,var(--card)));border-color:color-mix(in srgb,var(--g1) 55%,transparent);box-shadow:0 10px 30px -14px var(--g1)}
.badges .bd.on svg{animation:bob 4s ease-in-out calc(var(--i)*-.37s) infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(2deg)}}
.badges .bd:not(.on) svg{filter:grayscale(.8) brightness(.85)}.badges .bd .bar i{background:var(--c)}
.rk{display:flex;align-items:center;gap:18px}.nu{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.nu .it{flex:none;width:215px;display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.tw2{animation:twk 2.4s infinite}@keyframes twk{50%{opacity:.2}}
.au-m svg{overflow:visible}.au-c .chip{color:var(--tc)}
[data-cs=solid] .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--bg) 86%,var(--tx))}
[data-cs=outline] .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent;border-width:1.5px}
[data-cs=neon] .card{border-color:color-mix(in srgb,var(--a1) 55%,transparent);box-shadow:0 0 22px -8px var(--a1),inset 0 0 18px -12px var(--a1)}
.wk.open .dl{animation:dd .35s ease}@keyframes dd{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:900px){.card{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.orbs i{filter:blur(60px)}#tabs button svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}#tabs button.on svg{transform:translateY(-2px) scale(1.14)}.badges{grid-template-columns:repeat(2,1fr)}.rk{gap:14px}}
@media(max-width:640px){.md::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}.md{animation:sheet .45s cubic-bezier(.2,.9,.3,1)}.tpk{grid-template-columns:1fr 1fr}.stamp{padding:14px 20px}}
@keyframes sheet{from{transform:translateY(100%)}}
@media(hover:none){.tilt{transform:none!important}.card:hover{border-color:var(--line)}.thm:hover{transform:none}}

/* ===== v3: pro motion + chapter links ===== */
:root{--ease:cubic-bezier(.22,.9,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.anim .rise{animation-duration:.85s;animation-timing-function:var(--ease)}
@keyframes liIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes ttl{from{opacity:0;transform:translateX(-14px)}}
@keyframes navPop{0%{transform:scale(.55) rotate(-24deg)}100%{transform:none}}
@keyframes heroGlow{50%{transform:translate(-36px,28px) scale(1.25);opacity:.22}}
@keyframes barSh{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.pgA .tl h2{animation:ttl .6s var(--ease) backwards}
.pgA .nv.on svg,.pgA #tabs button.on svg{animation:navPop .6s var(--spring)}
.hero::after{animation:heroGlow 10s ease-in-out infinite}
.btn,.task,.seg button,.nv,#tabs button,.lkt{position:relative;overflow:hidden}
.btn{transition:transform .3s var(--spring),box-shadow .3s,background .3s,border-color .3s}
.btn:hover{transform:translateY(-2px)}
.btn.p::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-130%);transition:transform .8s var(--ease);pointer-events:none}
.btn.p:hover::after{transform:translateX(130%)}
.card:not(.tilt){transition:border-color .35s,box-shadow .5s var(--ease),background .3s}
.tilt{transition:transform .25s ease-out,border-color .35s,box-shadow .5s var(--ease)}
.card:hover{box-shadow:0 22px 50px -26px color-mix(in srgb,var(--a1) 60%,transparent)}
.li{transition:transform .35s var(--ease),border-color .3s,background .3s}
.li:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--a1) 35%,var(--line))}
.dr{transition:transform .3s var(--ease),background .2s}.dr:hover{transform:translateX(4px)}
.task{transition:transform .3s var(--spring),border-color .25s,background .3s,color .25s}
.task:hover{transform:translateY(-2px)}.task:active{transform:scale(.94)}
.seg button{transition:background .3s,color .3s,transform .3s var(--spring)}.seg button:active{transform:scale(.94)}
.nv{transition:transform .3s var(--ease),color .25s,background .25s}.nv:hover{transform:translateX(4px)}
.nv svg{transition:transform .4s var(--spring)}.nv:hover svg{transform:scale(1.18) rotate(-6deg)}
#tabs button{transition:transform .3s var(--spring),color .25s,background .25s}#tabs button:active{transform:scale(.88)}
.star{transition:transform .35s var(--spring),border-color .2s,background .2s,color .2s}.star:hover{transform:rotate(18deg) scale(1.12)}
.chev{transition:transform .45s var(--spring)}
.thm{transition:transform .35s var(--spring),border-color .25s,box-shadow .3s}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transform:translateX(-120%);animation:barSh 3.2s ease-in-out infinite}
.wk.opening .dl>*{animation:liIn .55s var(--ease) backwards}
.mo{animation:fd .3s}
.md{animation:mu .5s var(--spring)}
.toast{animation:tin .55s var(--spring)}

/* chapter name as a link-trigger */
.chn{display:inline-flex;align-items:center;gap:9px;text-align:left;font:inherit;color:inherit;position:relative;padding:2px 0 4px;max-width:100%;transition:transform .3s var(--spring)}
.chn::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;border-radius:2px;background:linear-gradient(90deg,var(--a1),var(--a2));transform:scaleX(.16);transform-origin:left;transition:transform .5s var(--ease)}
.chn:hover::after,.chn:focus-visible::after{transform:scaleX(1)}
.chn:active{transform:scale(.97)}
.chi{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--a1) 18%,transparent);color:var(--a1);transition:transform .45s var(--spring),background .3s,color .3s}
.chi svg{width:11px;height:11px;margin-left:1px}
.chn:hover .chi{transform:translateX(3px) scale(1.15);background:var(--a1);color:#14100a}

/* links sheet */
.lks{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;padding:16px}
.lks-bd{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);animation:fd .3s both}
.lks-p{position:relative;width:min(100%,400px);padding:22px 20px 16px;border-radius:26px;background:color-mix(in srgb,var(--bg) 90%,#fff 4%);border:1px solid var(--line);box-shadow:0 40px 100px -20px rgba(0,0,0,.65),0 0 0 1px color-mix(in srgb,var(--a1) 14%,transparent);overflow:hidden;animation:lkPop .6s var(--spring) both}
.lks-p::before{content:"";position:absolute;left:-30%;top:-70%;width:160%;height:100%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--a1) 30%,transparent),transparent 65%);opacity:.5;pointer-events:none;animation:lkGlow 6s ease-in-out infinite}
@keyframes lkGlow{50%{transform:translateX(8%) scale(1.1);opacity:.75}}
@keyframes lkPop{0%{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.3)}35%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lkOut{to{opacity:0;transform:translateY(10px) scale(.92)}}
@keyframes lkBdOut{to{opacity:0}}
@keyframes lkSheet{from{transform:translateY(100%)}}
@keyframes lkSheetOut{to{transform:translateY(100%)}}
.lks.out .lks-p{animation:lkOut .24s ease-in forwards}.lks.out .lks-bd{animation:lkBdOut .24s forwards}
.lks-h{position:relative;padding-right:36px;margin-bottom:18px;animation:wsIn .6s .08s both}
.lks-h h3{font-size:1.14rem;line-height:1.35;margin-top:3px}
.lks-h::after{content:"";display:block;height:2px;width:46px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,var(--a1),var(--a2));transform-origin:left;animation:lkLine .8s .35s var(--ease) both}
@keyframes lkLine{from{transform:scaleX(0)}}
.lks-x{position:absolute;top:0;right:0;width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:.8rem;transition:transform .4s var(--spring),color .2s}
.lks-x:hover{transform:rotate(90deg) scale(1.1);color:var(--tx)}
.lks-grab{display:none}
.lks-g{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lkt{--tc:var(--a1);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:center;min-width:0;transition:transform .4s var(--spring),border-color .3s,box-shadow .35s,background .3s;animation:lktIn .65s var(--spring) backwards;animation-delay:calc(.14s + var(--i)*70ms)}
@keyframes lktIn{from{opacity:0;transform:translateY(20px) scale(.7) rotate(-4deg);filter:blur(6px)}}
.lkt::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);animation:lkSh .9s calc(.55s + var(--i)*70ms) ease-out 1 both;pointer-events:none}
@keyframes lkSh{from{left:-70%}to{left:140%}}
.lkt:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--tc) 70%,transparent);box-shadow:0 16px 30px -14px var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--card))}
.lkt:active{transform:scale(.93)}
.lkt-ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 14%,transparent);overflow:hidden;transition:transform .5s var(--spring)}
.lkt:hover .lkt-ic{transform:scale(1.14) rotate(-4deg)}
.lkt-in{display:flex;align-items:center;justify-content:center;width:100%;height:100%;animation:lkF 4s ease-in-out calc(var(--i)*-.6s) infinite}
@keyframes lkF{50%{transform:translateY(-3px)}}
.lkt-in svg{width:32px;height:23px}
.lkt-in img{width:100%;height:100%;object-fit:contain;padding:6px}
.lkt-ini{font-style:normal;font-weight:700;font-size:.82rem;letter-spacing:.5px;color:var(--tc)}
.lkt b{font-size:.84rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkt small{font-size:.66rem;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkt.yt .lkt-ic{animation:ytP 2.6s infinite}
@keyframes ytP{0%{box-shadow:0 0 0 0 rgba(255,48,48,.5)}100%{box-shadow:0 0 0 14px transparent}}
.lkt.miss{border-style:dashed}.lkt.miss .lkt-ic{filter:grayscale(.7);opacity:.8}
.lkt.go{animation:lkGo .55s var(--ease) forwards;border-color:var(--tc);box-shadow:0 0 34px -4px var(--tc)}
@keyframes lkGo{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1.06)}}
.lks-set{display:block;margin:14px auto 0;font-size:.78rem;color:var(--mut);padding:8px 12px;border-radius:10px;transition:color .2s,transform .3s var(--spring);animation:wsIn .6s .7s both}

@media(max-width:640px){.lks{align-items:flex-end;padding:0}.lks-p{width:100%;border-radius:26px 26px 0 0;padding-bottom:calc(18px + var(--sab));animation:lkSheet .5s var(--ease) both}.lks.out .lks-p{animation:lkSheetOut .26s ease-in forwards}.lks-grab{display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}}

/* settings: class links */
.lkr{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;animation:liIn .5s var(--ease) backwards;transition:border-color .3s}

/* ===== v4 ===== */
body.calm .anim .rise{opacity:1}
.chw{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 10px;max-width:100%}
.chw .tgs{margin:0;gap:5px}.chw .tg{min-height:22px;padding:3px 9px;font-size:.66rem}

@keyframes icP{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tc) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

.lkr-logo{border-color:color-mix(in srgb,var(--tc,var(--a1)) 55%,transparent);background:color-mix(in srgb,var(--tc,var(--a1)) 14%,transparent)}
.lkr-logo img{padding:0;object-fit:contain}.lkr-logo b{color:var(--tc,var(--a1))}

/* ----- analytics ----- */
function heat(){const t=today(),days=[];for(let i=111;i>=0;i--)days.push(addD(t,-i));const pre=pd(days[0]).getDay();let h='';for(let i=0;i<pre;i++)h+='<i style="visibility:hidden"></i>';days.forEach((d,i)=>{const v=S.act[d]||0,l=v<=0?0:v<4?1:v<9?2:v<15?3:4;h+=`<i data-l="${l}" style="--d:${i}" title="${fD(d)} · ${v} tasks"></i>`});return`<div class="heat">${h}</div>`}
function weekBars(){const t=today(),vals=[],labs=[];for(let i=6;i>=0;i--){const d=addD(t,-i);vals.push(S.act[d]||0);labs.push(WD[pd(d).getDay()])}const mx=Math.max(...vals,8),W=320,H=170,bw=W/7;return`<svg class="ch" viewBox="0 0 ${W} ${H}" style="width:100%">${vals.map((v,i)=>{const h=Math.max((H-44)*v/mx,2),x=i*bw+bw*.2;return`<rect class="grow" style="--d:${i}" x="${x}" y="${H-24-h}" width="${bw*.6}" height="${h}" rx="6" fill="${i===6?'var(--a2)':'var(--a1)'}" opacity="${v?1:.25}"/><text x="${x+bw*.3}" y="${H-8}" text-anchor="middle">${labs[i]}</text>${v?`<text x="${x+bw*.3}" y="${H-30-h}" text-anchor="middle">${v}</text>`:''}`}).join('')}</svg>`}
function journey(){const W=340,H=190,L=30,R=10,T0=14,B=26,el=clamp(diff(S.start,today()),0,TOTAL),x=v=>L+(W-L-R)*v/TOTAL,y=v=>T0+(H-T0-B)*(1-v/TOTAL),c=new Array(TOTAL+1).fill(0);for(const i in S.days)if(S.days[i].done)c[clamp(diff(S.start,iso(new Date(S.days[i].done))),0,TOTAL)]++;let run=0;const pts=[];for(let d=0;d<=el;d++){run+=c[d];pts.push([x(d),y(run)])}
 let g='';[0,25,50,75,TOTAL].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v)+3}">${v}</text><text x="${x(v)}" y="${H-6}" text-anchor="middle">D${v}</text>`);
 const ln=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '),last=pts[pts.length-1];
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" style="width:100%"><defs><linearGradient id="ja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a1);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--a1);stop-opacity:0"/></linearGradient></defs>${g}<line x1="${x(0)}" y1="${y(0)}" x2="${x(TOTAL)}" y2="${y(TOTAL)}" stroke="var(--mut)" stroke-dasharray="4 5" opacity=".6"/><path d="${ln} L${last[0]},${y(0)} L${x(0)},${y(0)}Z" fill="url(#ja)"/><path class="draw" pathLength="1" d="${ln}" fill="none" stroke="url(#gr)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--a1)"/><circle cx="${last[0]}" cy="${last[1]}" r="10" fill="none" stroke="var(--a1)" opacity=".4"><animate attributeName="r" values="5;14;5" dur="2s" repeatCount="indefinite"/></circle></svg>`}
function radar(){const ks=Object.keys(SUBJ),cx=120,cy=112,R=80,n=ks.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,P=(i,f)=>[cx+Math.cos(ang(i))*R*f,cy+Math.sin(ang(i))*R*f],pv=ks.map(k=>{const ids=CHL[k]||[];return ids.length?ids.reduce((a,i)=>a+chN(i),0)/(ids.length*4):0});let g='';[.25,.5,.75,1].forEach(f=>g+=`<polygon points="${ks.map((_,i)=>P(i,f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`);ks.forEach((k,i)=>{const p=P(i,1),q=P(i,1.22);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)"/><text x="${q[0]}" y="${q[1]+3}" text-anchor="middle" style="fill:${SUBJ[k].c};font-weight:700">${SUBJ[k].e.replace('Chemistry','Chem').replace('Physics','Phy').replace('Higher ','')}</text>`});return`<svg class="ch" viewBox="0 0 240 230" style="width:100%;max-width:340px;margin:auto;display:block">${g}<polygon class="rad" points="${pv.map((v,i)=>P(i,Math.max(v,.03)).join(',')).join(' ')}" fill="var(--a1)" fill-opacity=".22" stroke="var(--a1)" stroke-width="2"/>${pv.map((v,i)=>{const p=P(i,Math.max(v,.03));return`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${SUBJ[ks[i]].c}"/>`}).join('')}</svg>`}
function typeBars(){const ids=Object.keys(CH);return TL.map((l,i)=>{const n=ids.filter(id=>gc(id).t[i]).length,p=Math.round(n/ids.length*100);return`<div style="margin-bottom:12px"><div class="row sp sm"><b>${l}</b><span class="mut">${n}/${ids.length} · ${p}%</span></div>${bar(p)}</div>`}).join('')}
function pgStats(){const s=stats(),done=s.days,rem=TOTAL-done,ex=diff(today(),examDate()),dl=Math.max(1,ex),st=status(),pct=done/TOTAL,el=clamp(diff(S.start,today())+1,1,TOTAL),ids=Object.keys(CH),tt=ids.length*4,td=ids.reduce((a,i)=>a+chN(i),0);
 let h=`<section class="card hero rise" style="${ri()}"><div style="position:relative;z-index:1"><div class="eyebrow">Where you are</div><h1 style="margin:8px 0 10px">Day ${cnt(el)}<small>/ ${TOTAL}</small></h1><div class="row wrap"><span class="chip ${st.k}">${st.t}</span><span class="chip">🔥 ${s.cur} day streak</span><span class="chip">🎓 ${ex>=0?ex+' days to exam':'Exam passed'}</span></div><div class="mut sm" style="margin-top:14px;max-width:420px">${done} of ${TOTAL} days complete · ${rem} to go · ${td}/${tt} core tasks ticked.</div></div>${ring(pct,150,11,`<b style="font-size:2rem">${Math.round(pct*100)}%</b>`,'JOURNEY')}</section>`;
 h+=`<div class="g4" style="margin-top:16px">${[[s.days,'Days completed'],[s.chs,'Chapters finished'],[s.tasks,'Tasks ticked'],[s.best,'Best streak (days)']].map(x=>`<div class="card stat tilt rise" style="${ri()}">${cnt(x[0])}<span>${x[1]}</span></div>`).join('')}</div>`;
 h+=`<section class="card rise" style="margin-top:16px;${ri()}"><div class="row sp wrap"><h3>Your journey</h3><span class="mut sm">dashed = ideal pace · solid = you</span></div><div style="margin-top:12px">${journey()}</div></section>`;
 h+=`<section class="card rise" style="margin-top:16px;${ri()}"><div class="row sp"><h3>Consistency · last 16 weeks</h3><span class="mut sm">brighter = more tasks</span></div><div style="margin-top:14px">${heat()}</div></section>`;
 h+=`<div class="g2" style="margin-top:16px"><section class="card rise" style="${ri()}"><h3 style="margin-bottom:10px">Subject balance</h3>${radar()}</section><section class="card rise" style="${ri()}"><h3 style="margin-bottom:10px">Tasks · this week</h3>${weekBars()}<h3 style="margin:18px 0 12px">By task type</h3>${typeBars()}</section></div>`;
 h+=`<section class="card rise" style="margin-top:16px;${ri()}"><h3>🎯 Pace</h3><div class="g3" style="margin-top:14px"><div><b style="font-size:1.4rem">${rem}</b><div class="mut sm">days of plan left</div></div><div><b style="font-size:1.4rem">${ex>=0?dl:0}</b><div class="mut sm">days until exam</div></div><div><b style="font-size:1.4rem" class="grad">${(rem/dl).toFixed(2)}</b><div class="mut sm">plan-days needed per day</div></div></div></section>`;
 h+=`<div class="eyebrow" style="margin:26px 4px 12px">Subjects</div><div class="g3">${Object.keys(SUBJ).map(k=>{const ids=CHL[k]||[],full=ids.filter(i=>chN(i)===4).length,tasks=ids.reduce((a,i)=>a+chN(i),0),p=ids.length?tasks/(ids.length*4):0;return`<article class="card tilt rise" style="--c:${SUBJ[k].c};${ri()}"><div class="row sp"><div><div class="sub">${esc(SUBJ[k].e)}</div><h3 style="margin-top:4px">${esc(SUBJ[k].n)}</h3></div>${ring(p,58,6,`<b style="font-size:.85rem">${Math.round(p*100)}%</b>`)}</div><div style="margin:14px 0 8px">${bar(p*100,SUBJ[k].c)}</div><div class="row sp sm mut"><span>${full}/${ids.length} chapters</span><span>${tasks}/${ids.length*4} tasks</span></div></article>`}).join('')}</div>`;
 h+=`<div class="eyebrow" style="margin:26px 4px 12px">Extra subjects</div><div class="g3">${Object.keys(EXTRA).map(k=>{const[t,l]=EXTRA[k],d=l.filter((_,i)=>(S.ex[k+'.'+i]||[]).filter(Boolean).length===4).length,p=Math.round(d/l.length*100);return`<article class="card rise" style="--c:${EXC[k]};${ri()}"><div class="sub">${esc(t)}</div><div style="margin:12px 0 8px">${bar(p,EXC[k])}</div><div class="row sp sm mut"><span>${d}/${l.length} done</span><span>${p}%</span></div></article>`}).join('')}</div>`;
 if(S.tests.length){const ts=[...S.tests].sort((a,b)=>a.date.localeCompare(b.date));h+=`<section class="card rise" style="margin-top:16px;${ri()}"><h3 style="margin-bottom:10px">Mock test trend</h3>${lineChart(ts.map(t=>Math.round(t.marks/t.total*1000)/10),ts.map(t=>fD(t.date)))}</section>`}

function chapterList(){const q=UI.q.toLowerCase();let h='';
 if(UI.cseg==='core'){Object.keys(SUBJ).forEach(k=>{const ids=(CHL[k]||[]).filter(i=>(!q||(SUBJ[k].n+CH[i].n+SUBJ[k].e).toLowerCase().includes(q))&&fpOk(i));if(!ids.length)return;const all=CHL[k],full=all.filter(i=>chN(i)===4).length,open=UI.open.has(k)||!!q||UI.fp!=='';
  h+=`<div class="card wk ${open?'open':''}" style="padding:0;margin-bottom:12px;--c:${SUBJ[k].c}"><div class="wh" data-act="acc" data-k="${k}"><div class="wn" style="background:${SUBJ[k].c};color:#111;border:0">${k}</div><div style="flex:1"><b>${esc(SUBJ[k].n)}</b><div class="mut sm">${full}/${all.length} chapters complete</div><div style="margin-top:8px">${bar(all.reduce((a,i)=>a+chN(i),0)/(all.length*4)*100,SUBJ[k].c)}</div></div><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div><div class="dl">${ids.map(i=>{const st=gc(i);return`<div class="li" data-ch="${i}" style="flex-direction:column;align-items:stretch;gap:10px;${prOf(i)?`border-left:3px solid ${PRI[prOf(i)][1]}`:''}"><div class="row sp"><div><b class="sm">${chName(i)}</b><div class="mut sm">${chRange(i)}${clTot(i)?' · ⏱ '+fmM(clTot(i)):''}</div><div class="tgs">${tagChips(i)}</div></div><button class="star ${st.w?'on':''}" data-act="weak" data-k="${i}">★</button></div><div class="tasks">${TL.map((_,x)=>tbtn(i,x,st.t[x])).join('')}</div></div>`}).join('')}</div></div>`})}
 else{Object.keys(EXTRA).forEach(k=>{const[t,list]=EXTRA[k];const idx=list.map((n,i)=>i).filter(i=>!q||(t+list[i]).toLowerCase().includes(q));if(!idx.length)return;const done=list.filter((_,i)=>(S.ex[k+'.'+i]||[]).filter(Boolean).length===4).length,open=UI.open.has(k)||!!q;

 return h||'<div class="empty">Nothing found 🔍</div>'}

function lineChart(pts,labs){const W=320,H=170,L=26,R=10,T0=12,B=24;if(!pts.length)return'<div class="empty">No data yet.</div>';const x=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1),y=v=>T0+(H-T0-B)*(1-v/100);let g='';[0,25,50,75,100].forEach(p=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)"/><text x="0" y="${y(p)+3}">${p}</text>`);const path=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),step=Math.ceil(pts.length/6);return`<svg class="ch" viewBox="0 0 ${W} ${H}" style="width:100%">${g}<path class="draw" pathLength="1" d="${path}" fill="none" stroke="url(#gr)" stroke-width="2.6" stroke-linecap="round"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.6" fill="var(--a1)"/>`).join('')}${labs.map((l,i)=>i%step===0||i===labs.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join('')}</svg>`}

/* ============ background canvas ============ */
const BG={c:$('#bg'),x:$('#bg').getContext('2d'),w:0,h:0,dpr:1,t:0,P:[],mx:.5,my:.5,raf:0,last:0,sh:null,nextSh:3};
const h2r=h=>{h=(h||'').trim();if(h[0]!=='#')return[255,200,100];if(h.length===4)h='#'+[...h.slice(1)].map(c=>c+c).join('');const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const cols=()=>{const cs=getComputedStyle(document.documentElement);return[h2r(cs.getPropertyValue('--a1')),h2r(cs.getPropertyValue('--a2'))]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function bgSize(){BG.dpr=Math.min(devicePixelRatio||1,1.5);BG.w=innerWidth;BG.h=innerHeight;BG.c.width=BG.w*BG.dpr;BG.c.height=BG.h*BG.dpr;BG.x.setTransform(BG.dpr,0,0,BG.dpr,0,0);bgSeed()}
function bgSeed(){const k=S.set.bgI/100,m=S.set.bg,r=Math.random;BG.P=[];seedX(k,m,r);if(m==='stars')for(let i=0;i<Math.round(160+600*k);i++)BG.P.push({x:r()*BG.w,y:r()*BG.h,z:r()*r(),tw:.5+r()*2,ph:r()*6});if(m==='aurora')for(let i=0;i<7;i++)BG.P.push({x:r()*BG.w,y:r()*BG.h,r:Math.max(BG.w,BG.h)*(.28+r()*.22),vx:(r()-.5)*40,vy:(r()-.5)*28,c:i%2});if(m==='particles')for(let i=0;i<Math.round(36+90*k*Math.min(1,BG.w/900+.3));i++)BG.P.push({x:r()*BG.w,y:r()*BG.h,vx:(r()-.5)*28,vy:(r()-.5)*28,s:1+r()*1.6})}
function bgDraw(dt){const{x,w,h}=BG,k=S.set.bgI/100,[a1,a2]=cols(),light=!!(THEMES.find(x=>x[0]===S.set.theme)||[])[5];x.clearRect(0,0,w,h);BG.t+=dt;const t=BG.t;
 if(S.set.bg==='stars'){const base=light?a1:[255,255,255];BG.P.forEach(p=>{p.y-=p.z*8*dt;p.x-=p.z*3*dt;if(p.y<-5)p.y=h+5;if(p.x<-5)p.x=w+5;const px=p.x+(BG.mx-.5)*p.z*30,py=p.y+(BG.my-.5)*p.z*30,a=(.25+.6*(.5+.5*Math.sin(t*p.tw+p.ph)))*(.4+.6*k)*(light?.7:1);x.fillStyle=rgba(p.z>.8?a1:base,a);x.beginPath();x.arc(px,py,p.z*1.5+.3,0,6.283);x.fill()});BG.nextSh-=dt;if(BG.nextSh<0&&!BG.sh){BG.nextSh=4+Math.random()*7;BG.sh={x:w*(.3+Math.random()*.7),y:Math.random()*h*.4,l:0}}if(BG.sh){const s=BG.sh;s.l+=dt*1.6;s.x-=dt*520;s.y+=dt*260;const g=x.createLinearGradient(s.x,s.y,s.x+120,s.y-60);g.addColorStop(0,rgba(a1,.9*(1-s.l)));g.addColorStop(1,rgba(a1,0));x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+120,s.y-60);x.stroke();if(s.l>=1)BG.sh=null}}
 else if(S.set.bg==='aurora'){x.globalCompositeOperation=light?'source-over':'lighter';BG.P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;const rr=p.r*(1+.12*Math.sin(t*.4+p.c)),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);g.addColorStop(0,rgba(p.c?a2:a1,(light?.22:.2)*k));g.addColorStop(1,rgba(p.c?a2:a1,0));x.fillStyle=g;x.fillRect(0,0,w,h)});x.globalCompositeOperation='source-over'}
 else if(S.set.bg==='particles'){const P=BG.P,d2=130*130;P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;const dx=p.x-BG.mx*w,dy=p.y-BG.my*h,dd=dx*dx+dy*dy;if(dd<14000){p.x+=dx*dt*1.4;p.y+=dy*dt*1.4}});for(let i=0;i<P.length;i++){const p=P[i];x.fillStyle=rgba(a1,.7*k+.15);x.beginPath();x.arc(p.x,p.y,p.s,0,6.283);x.fill();for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<d2){x.strokeStyle=rgba(a1,(1-d/d2)*.28*k);x.lineWidth=.8;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}}
 else if(S.set.bg==='waves'){for(let i=0;i<4;i++){const by=h*(.62+.08*i),amp=18+i*9,f=.004-i*.0005,sp=t*(.5+i*.2);const g=x.createLinearGradient(0,by-amp,0,h);g.addColorStop(0,rgba(i%2?a2:a1,(.1+.04*i)*k*(light?1.3:1)));g.addColorStop(1,rgba(i%2?a2:a1,0));x.fillStyle=g;x.beginPath();x.moveTo(0,h);for(let X=0;X<=w;X+=10)x.lineTo(X,by+Math.sin(X*f+sp)*amp+Math.sin(X*f*2.3-sp*1.3)*amp*.4);x.lineTo(w,h);x.closePath();x.fill()}}
 else if(drawX(t,dt,a1,a2,k,light)){}
 else if(S.set.bg==='grid'){const hz=h*.5,N=14,vx=w/2+(BG.mx-.5)*60;x.lineWidth=1;for(let i=-16;i<=16;i++){x.strokeStyle=rgba(a1,.22*k);x.beginPath();x.moveTo(vx+i*6,hz);x.lineTo(vx+i*(w/9),h);x.stroke()}for(let i=0;i<N;i++){const z=((i+t*.6)%N)/N,y=hz+(h-hz)*z*z;x.strokeStyle=rgba(a2,(.05+.4*z)*k);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}const g=x.createLinearGradient(0,hz-60,0,hz+40);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,rgba(a1,.07*k));x.fillStyle=g;x.fillRect(0,hz-60,w,100)}}
function bgLoop(ts){BG.raf=requestAnimationFrame(bgLoop);const dt=Math.min(.05,(ts-BG.last)/1000||.016);BG.last=ts;bgDraw(dt)}
function bgStart(){cancelAnimationFrame(BG.raf);BG.raf=0;if(S.set.bg==='none'||S.set.calm||document.hidden){BG.x.clearRect(0,0,BG.w,BG.h);return}BG.last=performance.now();BG.raf=requestAnimationFrame(bgLoop)}
addEventListener('resize',()=>{bgSize();bgStart()});
addEventListener('pointermove',e=>{BG.mx=e.clientX/innerWidth;BG.my=e.clientY/innerHeight},{passive:true});

 bx.innerHTML=`<div class="fv-ot"><i>${fIcon(m)}</i><b>${esc(m.name)}</b><span class="mut sm">${fSz(m.size||b.size)} · preview isn't available for this type</span><div class="row"><button class="btn p" data-act="fvDl">⬇ Download</button><button class="btn g" data-act="fvTab">Open in new tab</button></div></div>`}
Object.assign(ACT,{fOpen:el=>{const m=(S.files||[]).find(f=>f.id===el.dataset.k);m&&vGet('f:'+m.id).then(b=>b?fView(m,b):toast('This file is saved on another device','bad'))},
 fDel:el=>{const id=el.dataset.k;S.files=(S.files||[]).filter(f=>f.id!==id);vDel('f:'+id);save();render(false)},
 fvZ:el=>fvz(+el.dataset.d),fvX:fvClose,fvTab:()=>FV&&window.open(FV.url,'_blank'),
 fvR:()=>{if(!FV)return;FV.rot=(FV.rot+90)%360;FV.kind==='pdf'?pdfBuild():imgT()},
 fvFS:()=>{if(!FV)return;document.fullscreenElement?document.exitFullscreen():FV.el.requestFullscreen&&FV.el.requestFullscreen().catch(()=>{})},
 fvDl:()=>{if(!FV)return;const a=document.createElement('a');a.href=FV.url;a.download=FV.m.name;document.body.appendChild(a);a.click();a.remove()}});

/* ============ boot ============ */
function onboard(){modal(`<div style="text-align:center;margin-bottom:18px"><div class="logo" style="justify-content:center;padding:0 0 10px">${logoSVG()}</div><h2 style="margin-bottom:4px">Welcome to <span class="grad">Monk Mode</span></h2><div class="mut sm">Your 98-day discipline system. Set it up in 20 seconds.</div></div><div class="fg"><label class="l">Your name</label><input class="field" id="on" maxlength="30" placeholder="e.g. Fardin"></div><div class="fg"><label class="l">Day 1 starts on (you can change this anytime)</label><input type="date" class="field" id="os" value="${S.start}"></div><div class="fg"><label class="l">My goal / My why</label><textarea class="field" id="ow" maxlength="400" placeholder="Why am I doing this?" style="min-height:80px"></textarea></div><button class="btn p big" style="width:100%" data-act="onbSave">Begin the journey →</button>`)}
(function boot(){
 document.documentElement.style.setProperty('--fs',S.set.fs+'px');document.body.classList.toggle('calm',!!S.set.calm);applyTheme();applyIcon();bgSize();bgStart();
 const p=location.hash.replace('#/','');UI.page=PAGES[p]?p:'today';render(true);
 const cp=cloudInit();
 if(!S.onb){if(FB_CONFIG.databaseURL)Promise.race([cp,new Promise(r=>setTimeout(r,3500))]).then(()=>{S.onb?splash():onboard()});else onboard()}else splash();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 setInterval(()=>{const t=today();if(boot.d&&boot.d!==t)render(false);boot.d=t},60000);boot.d=today();
})();
})();
</script>
